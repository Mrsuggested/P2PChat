name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    - name: 设置 JDK 17
      uses: actions/setup-java@v4
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 下载 Gradle Wrapper
      run: |
        mkdir -p gradle/wrapper
        wget -O gradle/wrapper/gradle-wrapper.jar https://github.com/Mrsuggested/P2PChat/raw/main/gradle/wrapper/gradle-wrapper.jar || \
        curl -L "https://services.gradle.org/distributions/gradle-8.2-bin.zip" -o /tmp/gradle.zip && \
        unzip -o /tmp/gradle.zip -d /tmp/ && \
        cp /tmp/gradle-8.2/lib/gradle-wrapper-*.jar gradle/wrapper/gradle-wrapper.jar 2>/dev/null || true

    - name: 设置 Gradle（直接安装）
      run: |
        sudo apt-get update -qq && sudo apt-get install -y wget unzip
        wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
        sudo unzip -q gradle-8.2-bin.zip -d /opt
        echo "GRADLE_HOME=/opt/gradle-8.2" >> $GITHUB_ENV
        echo "/opt/gradle-8.2/bin" >> $GITHUB_PATH

    - name: 编译 Debug APK
      run: gradle assembleDebug

    - name: 上传 APK
      uses: actions/upload-artifact@v4
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      with:
        name: P2PChat-APK
        path: app/build/outputs/apk/debug/app-debug.apk
